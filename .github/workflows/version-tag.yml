# GITHUB_TOKEN tag pushes do not trigger another push workflow. Invoke the
# reusable release workflow directly after creating and verifying the tag.
name: Auto-tag Release

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'

permissions:
  contents: read

concurrency:
  group: auto-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.version.outputs.TAG }}
      commit: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        run: python3 tools/release_metadata.py >> "$GITHUB_OUTPUT"

      - name: Create and verify release tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.TAG }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash tools/create_release_tag.sh

  release:
    needs: create-tag
    if: needs.create-tag.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.create-tag.outputs.tag }}
      release_commit: ${{ needs.create-tag.outputs.commit }}
