# GitHub Actions workflow for building and releasing OGEdit
#
# Triggers:
# - Tags matching 'release/v*' (e.g., release/v1.2.1)
#
# Publishing a release:
# 1. Update version in Cargo.toml
# 2. Commit: git commit -am "Release v1.2.1"
# 3. Tag: git tag release/v1.2.1
# 4. Push: git push && git push --tags
#
# Build Outputs:
# - ogedit-windows-x64.zip
# - ogedit-windows-arm64.zip
# - ogedit-linux-x64.zip
# - ogedit-macos-x64.zip
# - ogedit-macos-arm64.zip
# - SHA256 checksums for each

name: Release

on:
  push:
    tags:
      - "release/v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ogedit-windows-x64
            binary: ogedit.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: ogedit-windows-arm64
            binary: ogedit.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ogedit-linux-x64
            binary: ogedit
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ogedit-macos-x64
            binary: ogedit
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ogedit-macos-arm64
            binary: ogedit

    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
        if: matrix.os == 'windows-latest'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install nightly --no-self-update --profile minimal --component rust-src
          rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --config .cargo/release-nightly.toml --release --target ${{ matrix.target }}

      - name: Create artifact directory
        shell: bash
        run: mkdir -p artifact

      - name: Copy binary to artifact
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} artifact/
          # Also create alternative binary name
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} artifact/ogmsedit${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Copy license and readme
        shell: bash
        run: |
          cp README.md artifact/
          cp LICENSE artifact/ 2>/dev/null || echo "No LICENSE file"

      - name: Create zip (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd artifact
          zip -r ../${{ matrix.artifact }}.zip ./*
          cd ..
          sha256sum ${{ matrix.artifact }}.zip > ${{ matrix.artifact }}.zip.sha256
          cat ${{ matrix.artifact }}.zip.sha256

      - name: Create zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path artifact/* -DestinationPath ${{ matrix.artifact }}.zip
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.artifact }}.zip).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding utf8 ${{ matrix.artifact }}.zip.sha256
          Get-Content ${{ matrix.artifact }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 5

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.sha256
          path: ${{ matrix.artifact }}.zip.sha256
          retention-days: 5

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ogedit-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/release/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if prerelease
        id: check_prerelease
        run: |
          if [[ $GITHUB_REF =~ .*(-alpha|-beta|-rc).* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "## OGEdit v${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Downloads" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "| Platform | Architecture | Download |" >> $GITHUB_OUTPUT
          echo "|----------|--------------|----------|" >> $GITHUB_OUTPUT
          echo "| Windows | x64 | \`ogedit-windows-x64.zip\` |" >> $GITHUB_OUTPUT
          echo "| Windows | ARM64 | \`ogedit-windows-arm64.zip\` |" >> $GITHUB_OUTPUT
          echo "| Linux | x64 | \`ogedit-linux-x64.zip\` |" >> $GITHUB_OUTPUT
          echo "| macOS | x64 (Intel) | \`ogedit-macos-x64.zip\` |" >> $GITHUB_OUTPUT
          echo "| macOS | ARM64 (Apple Silicon) | \`ogedit-macos-arm64.zip\` |" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Verification" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "SHA256 checksums are provided for each download (\`.sha256\` files)." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Installation" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "1. Download the appropriate zip for your platform" >> $GITHUB_OUTPUT
          echo "2. Extract to a directory in your PATH" >> $GITHUB_OUTPUT
          echo "3. Run \`ogedit\` or \`ogmsedit\`" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.IS_PRERELEASE }}
          files: |
            ogedit-*.zip
            ogedit-*.zip.sha256
