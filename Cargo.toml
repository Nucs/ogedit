[workspace]
members = ["vendor/lsh"]
default-members = ["."]
exclude = ["fuzz"]
resolver = "3"

[package]
name = "ogedit"
version = "2.0.0"
edition = "2024"
rust-version = "1.93"
readme = "README.md"
repository = "https://github.com/Nucs/ogedit"
homepage = "https://github.com/Nucs/ogedit"
license = "MIT"
categories = ["text-editors"]
build = "build/main.rs"

[[bin]]
name = "ogedit"
path = "src/bin/edit/main.rs"

[[bench]]
name = "lib"
harness = false

[features]
debug-latency = []

# We use `opt-level = "s"` as it significantly reduces binary size.
# We could then use the `#[optimize(speed)]` attribute for spot optimizations.
# Unfortunately, that attribute currently doesn't work on intrinsics such as memset.
[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # No one needs an undebuggable release binary
lto = true                  # reduces binary size by ~14%
opt-level = "s"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
incremental = true          # Improves re-compile times

[profile.bench]
codegen-units = 16          # Make compiling criterion faster (16 is the default, but profile.release sets it to 1)
lto = "thin"                # Similarly, speed up linking by a ton

[dependencies]
atomicwrites = "0.4.4"
notify = "8.2"
similar = "3.2"
csv = "1.4"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
regex = "1.13"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
nucleo = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lsh = { path = "vendor/lsh", default-features = false, features = ["glob"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
lsh = { path = "vendor/lsh", default-features = false, features = ["compiler", "glob"] }
# The default toml crate bundles its dependencies with bad compile times. Thanks.
# Thankfully toml-span exists. FWIW the alternative is yaml-rust (without the 2 suffix).
toml-span = { version = "0.5", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.22", default-features = false }

[target.'cfg(windows)'.dependencies.windows]
version = "0.59"
features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
zstd = { version = "0.13", default-features = false }
